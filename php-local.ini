; Project-local PHP overrides for running the test suite on Windows.
; Used via:  php -c php-local.ini  (nothing outside this repo is modified)
;
; The winget PHP build ships sodium but not pcntl (POSIX-only), so horizon's
; ext-pcntl requirement is satisfied with --ignore-platform-req at install
; time. redis is likewise absent from this build.

extension_dir = "C:/Users/Etemadi/AppData/Local/Microsoft/WinGet/Packages/PHP.PHP.8.3_Microsoft.Winget.Source_8wekyb3d8bbwe/ext"

extension=curl
extension=exif
extension=ffi
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=openssl
extension=pdo_sqlite
extension=sodium
extension=sqlite3
extension=zip

memory_limit = 1024M
date.timezone = UTC

; The winget build's bundled extras/ssl/openssl.cnf sets `dir = ./demoCA`
; with config_diagnostics = 1, and that directory does not exist, so
; openssl_pkey_new() fails and UserObserver's RSA key generation dies.
; openssl-local.cnf in the project root is a minimal replacement that only
; loads the default provider, which is all key generation needs.
openssl.cafile = "Q:/Vibe Coding/Pixelfed/openssl-local.cnf"

ffi.enable = "true"
